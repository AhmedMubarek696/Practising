<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="Author" content="Ahmed Mohammed">
        <meta name="Description" content="Forms">
        <title>Forms</title>
        <link rel="icon" href="img/HTML_Logo.png" type="image/x-icon">
        <link rel="stylesheet" href="main.CSS" type="text/CSS">
    </head>
    <body>
        <header>
            <h1>Forms</h1>
            <nav>
                <h2>Content</h2>
                <ul>
                    <li><a href="#formA">Form A</a></li>
                </ul>
            </nav>
            <hr>
            <hr>
        </header>
        <main>
            <section id="formA">
                <h2>Form A</h2>
                <p>Add your data here</p>

                <form action="https://httpbin.org/get" method="get">

                   <fieldset>
                        <legend>Single Text</legend>

                        <p>
                        <label for="firstName">First Name:</label>
                        <input type="text" name="firstName" id="firstName" required placeholder="Ahmed" autofocus>
                        </p>

                        <p>
                        <label for="lastName">Last Name:</label>
                        <input type="text" name="lastName" id="lastName" required placeholder="Mohammed">
                        </p>

                        <p>
                        <label for="password">Password:</label>
                        <input type="password" name="password" id="password" required>
                        </p>

                        <p>
                        <label for="phone">Phone:</label>
                        <input type="tel" name="phone" id="phone" placeholder="01020233743" pattern="[0]{1}[0-9]{10}">
                        </p>

                   </fieldset>
                   <br>
                   <fieldset>
                        <legend>Numeric List</legend>

                        <p>
                            <label for="selectDecade">Select Decade</label>
                            <input type="number" name="selectDecade" id="selectDecade" min="1950" max="2020" step="10" value="1990" required>
                        </p>

                   </fieldset>
                   <br>

                   <fieldset>
                        <legend>Data List</legend>

                        <p>
                            <label for="listFieldB">List B</label>
                            <input type="text" name="listFieldB" id="listFieldB" list="datalistB">
                            <datalist id="datalistB">
                                <option value="value 1">value 1</option>
                                <option value="value 2">value 2</option>
                                <option value="value 3">value 3</option>
                                <option value="value 4">value 4</option>
                                <option value="value 5">value 5</option>
                                <option value="value 6">value 6</option>
                            </datalist>
                        </p>
                   </fieldset>
                   <br>
                   <fieldset>
                        <legend>Select List</legend>

                        <p>
                            <label for="listD">List D</label>
                            <select name="ListD" id="ListD">
                                <optgroup label="Group A">
                                    <option value="value A1">Value A1</option>
                                    <option value="value A2" selected>Value A2</option>
                                    <option value="value A3">Value A3</option>
                                </optgroup>
                                <optgroup label="Group B">
                                    <option value="value B1">Value B1</option>
                                    <option value="value B2">Value B2</option>
                                    <option value="value B3">Value B3</option>
                                </optgroup>
                                <option value="value C">Value C</option>
                            </select>
                        </p>
                   </fieldset>
                   <br>

                   <fieldset>
                        <legend>Radio Button</legend>
                        
                        <p>
                            <label for="radioA1">Radio A1</label>
                            <input type="radio" name="radioA" id="radioA1" value="radio A1">
                        </p>
                        <p>
                            <label for="radioA2">Radio A2</label>
                            <input type="radio" name="radioA" id="radioA2" value="radio A2">
                        </p>
                        <p>
                            <label for="radioA3">Radio A3</label>
                            <input type="radio" name="radioA" id="radioA3" value="radio A3">
                        </p>
                   </fieldset>
                   <br>

                   <fieldset>
                        <legend>Free Text Note</legend>

                        <label for="textAreaA">Text Note:</label>
                        <textarea name="textAreaA" id="textAreaA" rows="10" cols="60" placeholder="Write your note here.." ></textarea>
                   </fieldset>
                   <br>
                   
                   <button type="submit">Submit</button>
                   <button type="submit" formaction="https://httpbin.org/post" formmethod="post">Post</button>
                   <button type="reset">Reset</button>
                </form>


            </section>
        </main>
        <footer>
            <a href="#">Back To The Top</a> <br>

            <a href="me.html">About Me</a> <br>
            <a href="tables.html">Tables</a> <br>
            &lt;&lt;&lt;&copy;Ahmed Mohammed&gt;&gt;&gt;
        </footer>
    </body>
</html>
